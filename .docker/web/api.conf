<VirtualHost *:80>
    ServerName pdv-master.local

    DocumentRoot /var/www/html/public

    ErrorLog ${APACHE_LOG_DIR}/pdv_error.log
    CustomLog ${APACHE_LOG_DIR}/pdv_access.log combined

    <Directory /var/www/html/public>
        DirectoryIndex index.php
        AllowOverride All
        Options -Indexes +FollowSymLinks
        Require all granted
    </Directory>

    # Permite acesso a arquivos estáticos fora do public (se necessário)
    Alias /vendor /var/www/html/vendor
</VirtualHost>
